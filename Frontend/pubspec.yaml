name: maxion_wheels_dispatch
description: "Maxion Wheels Dispatch Operations Digitalization Flutter App by Vistar Logitek"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  # Pure-Dart QR encoding, so print templates generate symbols offline
  # instead of fetching them from a public web API.
  qr: ^3.0.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  excel: ^4.0.6
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # Only the autocropped derivatives ship. assets/logo.png and
    # assets/logo_name.png stay in the repo as the source art the derivatives
    # are generated from - bundling them too would add 4.2 MB the app never
    # loads. Regenerate with tool/build_brand_assets.js after changing either.
    - assets/brand/
