<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Maxion Wheels Dispatch Operations Digitalization Flutter App by Vistar Logitek">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Maxion Wheels Dispatch">

  <title>Maxion Wheels Dispatch Operations Digitalization · Vistar Logitek</title>
  <link rel="manifest" href="manifest.json">

  <!-- Vistar Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #7A1FB0; --violet: #9B30C9; --magenta: #C018C0; --pink: #E0218A;
      --red: #C8102E; --orange-red: #F0480C; --orange: #F06000; --amber: #F0C000;
      --yellow: #F0E060; --cream: #FFF6CC;
      --ribbon: linear-gradient(115deg, #7A1FB0 0%, #B81FB8 22%, #E0218A 40%, #D11630 56%, #F0480C 70%, #F06000 80%, #F0C000 92%, #F7EE9A 100%);
      --bg: #070611; --bg2: #0B0A18;
      --surface: #110F1E; --surface2: #16142A; --surface3: #1D1A33;
      --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.13);
      --txt: #F2EEFB; --txt2: #B9B2D6; --txt3: #7E769B;
    }

    body {
      background-color: var(--bg);
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      color: var(--txt);
      overflow-x: hidden;
    }

    ::selection {
      background: rgba(224,33,138,.35);
      color: #ffffff;
    }

    /* Custom Vistar Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(155,48,201,.4);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--pink);
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
